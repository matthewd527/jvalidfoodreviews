name: Stats refresh

on:
  schedule:
    # Five times a day, roughly every five hours (UTC; GitHub cron ignores DST).
    #
    # Why five and not one: the TikTok embed feed only ever exposes his ten most
    # recent videos, and he posts three or four a day. A single daily check
    # leaves less than three days of slack before a video scrolls out of that
    # window and is lost for good. Checking every five hours means roughly one
    # new video per run, so the window can never overflow between runs - and if
    # GitHub drops or delays a run under load, four others still cover the day.
    #
    # The odd minute matters: workflows scheduled on the hour queue behind
    # everyone else's and are the first to be delayed or dropped.
    - cron: "12 2,7,12,17,22 * * *"
  workflow_dispatch: {} # lets you run it by hand from the Actions tab

# Only one refresh at a time; a manual run supersedes a queued scheduled one.
concurrency:
  group: daily-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh data from TikTok and Instagram
        id: refresh
        env:
          IG_HANDLE: jvalidfoodreviews   # set to "" to disable Instagram
        run: python3 scripts/update.py

      - name: Commit any changes
        id: commit
        run: |
          git config user.name  "jvalid-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets
          if git diff --staged --quiet; then
            echo "nothing changed"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: refresh stats $(date -u +'%Y-%m-%d %H:%M')"
            # Another run may have landed while this one was working, so rebase
            # onto whatever is on the remote rather than failing the push.
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "push attempt $attempt failed, retrying"
              sleep 5
            done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A scheduled workflow is disabled automatically after 60 days with no
      # repository activity. Bot pushes made with GITHUB_TOKEN do NOT reset that
      # clock, so on quiet stretches we touch a heartbeat file to keep the
      # schedule alive without needing a human commit.
      - name: Keep the schedule alive
        if: steps.commit.outputs.changed == 'false'
        run: |
          mkdir -p .github
          date -u +%Y-%m-%dT%H:%M:%SZ > .github/last-run.txt
          git add .github/last-run.txt
          git commit -m "chore: heartbeat $(date -u +%Y-%m-%d)" || exit 0
          git push

# Deployment is Cloudflare Pages' job: it watches this repo and publishes on
# every push, including the ones this workflow makes. Nothing to do here.
