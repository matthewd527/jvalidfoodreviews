name: Stats refresh

on:
  schedule:
    # Every three hours (UTC; GitHub cron ignores DST).
    #
    # Why so often: the TikTok embed feed only exposes his newest ten-or-so
    # videos, and by October 2026 he was posting about eight a day, so the
    # window covers barely a day and a half. A video that scrolls out of it
    # between two successful runs is never picked up. GitHub also quietly
    # drops about one scheduled run in four (measured over 60 days: 3.75 of 5
    # a day ran), so a gap is always longer than the schedule says. Every three
    # hours keeps even a bad stretch far inside the window, and each run also
    # re-reads ~20 older videos' view counts, so more runs = fresher numbers.
    #
    # The odd minute matters: workflows scheduled on the hour queue behind
    # everyone else's and are the first to be delayed or dropped.
    #
    # Budget: each run pushes at most once, and Cloudflare Pages' free plan
    # allows 500 builds a month. Eight a day is under 250.
    - cron: "23 */3 * * *"
  workflow_dispatch: {} # lets you run it by hand from the Actions tab

# Only one refresh at a time; a manual run supersedes a queued scheduled one.
concurrency:
  group: daily-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # v7 of both run on Node 24. The v4/v5 they replace ran on Node 20, which
      # GitHub has deprecated and is forcing over to 24 ahead of removing it.
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Refresh data from TikTok and Instagram
        id: refresh
        env:
          IG_HANDLE: jvalidfoodreviews   # set to "" to disable Instagram
        run: python3 scripts/update.py

      - name: Commit any changes
        id: commit
        run: |
          git config user.name  "jvalid-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets
          if git diff --staged --quiet; then
            echo "nothing changed"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: refresh stats $(date -u +'%Y-%m-%d %H:%M')"
            # Another run may have landed while this one was working, so rebase
            # onto whatever is on the remote rather than failing the push.
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "push attempt $attempt failed, retrying"
              sleep 5
            done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A public repo's scheduled workflows are switched off after 60 days with
      # no repository activity, and once this is handed off the only commits
      # it gets are this job's. Commits made with GITHUB_TOKEN do count - it is
      # what keepalive actions such as efrecon/gh-action-keepalive rely on - so
      # any run that finds something new keeps the schedule alive by itself,
      # and on a run that finds nothing, this heartbeat commit does it instead.
      - name: Keep the schedule alive
        if: steps.commit.outputs.changed == 'false'
        run: |
          mkdir -p .github
          date -u +%Y-%m-%dT%H:%M:%SZ > .github/last-run.txt
          git add .github/last-run.txt
          git commit -m "chore: heartbeat $(date -u +%Y-%m-%d)" || exit 0
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main && git push && break
            echo "push attempt $attempt failed, retrying"
            sleep 5
          done

# Deployment is Cloudflare Pages' job: it watches this repo and publishes on
# every push, including the ones this workflow makes. Nothing to do here.
